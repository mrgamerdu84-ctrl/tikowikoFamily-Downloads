name: Changer le statut d'une application

on:
  workflow_dispatch:
    inputs:
      application:
        description: "Choisis l'application"
        required: true
        type: choice
        options:
          - tikowikoFamilyGames
          - tikowikodelivery
          - tiko-express
          - tikowikocity
          - tikowikocosystme
          - TikowikoMusicV2
          - TikowikoMusic
          - jackpot-sucr-casino
          - super-winner-de-la-fortune
          - SmoothinCreams
          - histoire-pour-enfants
          - ilopolis
          - tikoWiko-Anti-virus-
          - tikowikointelligent-
          - tikowiko-agenda-budg-taire
          - tikoWiko-taxi-
          - planete-sharky-game
          - la-jungle-de-l-arcade
          - l-attaque-des-dieux
          - tapas-fiesta
          - snack-attack-
          - Game-Booster4K
          - TikoWiko-Aviator
          - tikowiko-security
          - batterie-super-intelligente
          - chicken-coop-charm
          - clandestin-arcade-manager
          - divertissement-zen-
          - gang-de-serpent
          - gleam-mine-adventure
          - Grimoix-petit-dragon
          - my-taxi-world-les-rue-sont-nous-bc60a008
          - N-on-Jetons-
      statut:
        description: "Choisis la couleur / le statut"
        required: true
        default: "🟣 Violet — En réflexion"
        type: choice
        options:
          - "🟣 Violet — En réflexion"
          - "🟡 Jaune — Test développeur"
          - "🟠 Orange — Correction active"
          - "🔵 Bleu — Développement actif"
          - "🟢 Vert — Disponible / test"
          - "⚪ Gris — Stable pour le moment"
          - "🔴 Rouge — Indisponible"
          - "⚙️ Automatique — Choix automatique"

permissions:
  contents: write

jobs:
  statut:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Appliquer le statut choisi
        env:
          APP: ${{ inputs.application }}
          STATUT: ${{ inputs.statut }}
        shell: bash
        run: |
          set -e
          FILE="STATUTS_MANUELS.txt"
          touch "$FILE"

          python3 - "$FILE" "$APP" "$STATUT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          app = sys.argv[2].strip()
          statut = sys.argv[3].strip()

          mapping = {
              "🟣 Violet — En réflexion": "purple",
              "🟡 Jaune — Test développeur": "yellow",
              "🟠 Orange — Correction active": "orange",
              "🔵 Bleu — Développement actif": "blue",
              "🟢 Vert — Disponible / test": "green",
              "⚪ Gris — Stable pour le moment": "gray",
              "🔴 Rouge — Indisponible": "red",
              "⚙️ Automatique — Choix automatique": "auto",
          }

          color = mapping.get(statut)
          if not color:
              raise SystemExit(f"Statut inconnu: {statut}")
          if not app:
              raise SystemExit("Nom d'application vide")

          lines = path.read_text(encoding="utf-8").splitlines()
          kept = []
          for line in lines:
              raw = line.strip()
              if not raw or raw.startswith("#") or "|" not in raw:
                  kept.append(line)
                  continue
              current, _ = raw.split("|", 1)
              if current.strip().casefold() != app.casefold():
                  kept.append(line)

          if color != "auto":
              kept.append(f"{app}|{color}")

          path.write_text("\n".join(kept).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Enregistrer le changement
        env:
          APP: ${{ inputs.application }}
          STATUT: ${{ inputs.statut }}
        run: |
          set -e
          if git diff --quiet STATUTS_MANUELS.txt; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUTS_MANUELS.txt
          git commit -m "Change le statut de $APP : $STATUT"
          git push origin HEAD:main

      - name: Résumé
        env:
          APP: ${{ inputs.application }}
          STATUT: ${{ inputs.statut }}
        run: |
          echo "### Statut mis à jour" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Application :** $APP" >> "$GITHUB_STEP_SUMMARY"
          echo "**Statut :** $STATUT" >> "$GITHUB_STEP_SUMMARY"
