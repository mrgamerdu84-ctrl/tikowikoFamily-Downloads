          - "🔴 Rouge — Indisponible"
          - "⚙️ Automatique — Choix automatique"

permissions:
  contents: write

jobs:
  statut:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Appliquer le statut aux applications sélectionnées
        env:
          APP1: ${{ inputs.application_1 }}
          APP2: ${{ inputs.application_2 }}
          APP3: ${{ inputs.application_3 }}
          APP4: ${{ inputs.application_4 }}
          APP5: ${{ inputs.application_5 }}
          APP6: ${{ inputs.application_6 }}
          APP7: ${{ inputs.application_7 }}
          APP8: ${{ inputs.application_8 }}
          APP_CUSTOM: ${{ inputs.applications_libres }}
          STATUT: ${{ inputs.statut }}
        shell: bash
        run: |
          set -e
          FILE="STATUTS_MANUELS.txt"
          touch "$FILE"

          python3 - "$FILE" "$STATUT" "$APP1" "$APP2" "$APP3" "$APP4" "$APP5" "$APP6" "$APP7" "$APP8" "$APP_CUSTOM" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          statut = sys.argv[2].strip()
          apps = [a.strip() for a in sys.argv[3:-1] if a.strip() and a.strip() != "— Aucune —"]
          apps += [a.strip() for a in re.split(r"[,;\n]+", sys.argv[-1]) if a.strip()]
          aliases = {"la-petite-boulangerie-refonte": "la-petite-boulangerie"}
          apps = [aliases.get(a.casefold(), a) for a in apps]
          if any(not re.fullmatch(r"[A-Za-z0-9._-]+", a) for a in apps):
              raise SystemExit("Utilise les noms exacts des dépôts (sans espace), séparés par des virgules.")

          mapping = {
              "💙 Bleu clair — Importé depuis Lovable / à vérifier": "cyan",
              "🟣 Violet — En réflexion": "purple",
              "🟡 Jaune — Test développeur": "yellow",
              "🟠 Orange — Correction active": "orange",
              "🔵 Bleu — Développement actif": "blue",
              "🟢 Vert — Disponible / test": "green",
              "⚪ Gris — Stable pour le moment": "gray",
              "🔴 Rouge — Indisponible": "red",
              "⚙️ Automatique — Choix automatique": "auto",
          }

          color = mapping.get(statut)
          if not color:
              raise SystemExit(f"Statut inconnu: {statut}")
          if not apps:
              raise SystemExit("Aucune application sélectionnée")

          unique = []
          seen = set()
          for app in apps:
              key = app.casefold()
              if key not in seen:
                  seen.add(key)
                  unique.append(app)
          apps = unique

          lines = path.read_text(encoding="utf-8").splitlines()
          selected = {a.casefold() for a in apps}
          kept = []
          for line in lines:
              raw = line.strip()
              if not raw or raw.startswith("#") or "|" not in raw:
                  kept.append(line)
                  continue
              current, _ = raw.split("|", 1)
              if current.strip().casefold() not in selected:
                  kept.append(line)

          if color != "auto":
              for app in apps:
                  kept.append(f"{app}|{color}")

          path.write_text("\n".join(kept).rstrip() + "\n", encoding="utf-8")
          print("Applications modifiées : " + ", ".join(apps))
          PY

      - name: Mettre à jour immédiatement le catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 scripts/update_catalog.py

      - name: Enregistrer le changement
        env:
          STATUT: ${{ inputs.statut }}
        run: |
          set -e
          if git diff --quiet STATUTS_MANUELS.txt README.md; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUTS_MANUELS.txt README.md
          git commit -m "Change le statut de plusieurs applications : $STATUT"
          git push origin HEAD:main

      - name: Résumé
        env:
          APP1: ${{ inputs.application_1 }}
          APP2: ${{ inputs.application_2 }}
          APP3: ${{ inputs.application_3 }}
          APP4: ${{ inputs.application_4 }}
          APP5: ${{ inputs.application_5 }}
          APP6: ${{ inputs.application_6 }}
          APP7: ${{ inputs.application_7 }}
          APP8: ${{ inputs.application_8 }}
          APP_CUSTOM: ${{ inputs.applications_libres }}
          STATUT: ${{ inputs.statut }}
        run: |
          echo "### Statut groupé mis à jour" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Statut :** $STATUT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Applications sélectionnées :**" >> "$GITHUB_STEP_SUMMARY"
          for APP in "$APP1" "$APP2" "$APP3" "$APP4" "$APP5" "$APP6" "$APP7" "$APP8"; do
            [ -z "$APP" ] && continue
            [ "$APP" = "— Aucune —" ] && continue
            echo "- $APP" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -z "$APP_CUSTOM" ] || echo "- Nouveaux jeux : $APP_CUSTOM" >> "$GITHUB_STEP_SUMMARY"
